name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Clean Project and Build APK
        run: |
          # إنشاء مشروع فلاتر نظيف بداخل مجلد مؤقت
          flutter create temp_project --org com.netguard --project-name netguard_app
          
          # نقل ملف الmain.dart والpubspec.yaml الخاص بك إلى المشروع الجديد
          rm -rf temp_project/lib/*
          cp -r lib/* temp_project/lib/
          cp pubspec.yaml temp_project/pubspec.yaml
          
          # الانتقال للمشروع وبناء ملف الـ APK بنجاح
          cd temp_project
          flutter pub get
          flutter build apk --release
          
          # نقل ملف الـ APK الناتج للمسار الرئيسي ليتم رفعه
          mkdir -p ../build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
